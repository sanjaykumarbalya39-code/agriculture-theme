<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 – Page not found | Cultivo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="nf">
  <div>
    <h1>404</h1>
    <h2>Page not found</h2>
    <p>This page doesn't exist yet. Go back to where you were, or exit to the homepage.</p>
    <div class="actions">
      <button type="button" class="btn-outline" id="back">&larr; Back</button>
      <a href="index.html" class="btn-dark" id="exit">Exit to Home</a>
    </div>
  </div>
</main>
<script>
document.getElementById('back').addEventListener('click',function(){
  if(document.referrer && history.length>1){history.back();}else{location.href='index.html';}
});
</script>
</body>
</html>
